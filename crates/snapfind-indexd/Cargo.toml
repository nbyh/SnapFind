[package]
name = "snapfind-indexd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "snapfind-indexd"
path = "src/main.rs"

[dependencies]
snapfind-core = { path = "../snapfind-core" }
snapfind-engine = { path = "../snapfind-engine" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "io-std"] }
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
# 冒烟链路测试：用真实 IPC 客户端驱动真实 indexd 进程
snapfind-ipc-client = { path = "../snapfind-ipc-client" }
